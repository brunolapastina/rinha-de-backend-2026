services:

  nginx:
    image: nginx:alpine
    container_name: rinha-nginx
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - sock:/run/sock
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 30MB
  
  api1: &api
    build:
      context: ./FraudDetection
      dockerfile: Dockerfile
    image: rinha-backend-2026
    user: "101:101" 
    container_name: rinha-api1
    hostname: api1
    volumes:
      - sock:/run/sock
    environment:
      - SOCKET_PATH=/run/sock/api1.sock
    deploy:
      resources:
        limits:
          cpus: "0.4"
          memory: 160MB

  api2:
    <<: *api
    build: !reset null
    container_name: rinha-api2
    hostname: api2
    environment:
      - SOCKET_PATH=/run/sock/api2.sock

volumes:
  sock:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=4m,mode=0777"